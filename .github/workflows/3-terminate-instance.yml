name: 3 - Terminate Instance

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terminate:
    name: 'Terminate EC2 Instance'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terminate EC2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=DockerAppServer" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
            
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "No running instance found to terminate."
            exit 0
          fi
          
          echo "Terminating instance with ID: $INSTANCE_ID"
          aws ec2 terminate-instances --instance-ids $INSTANCE_ID
          
          echo "Instance termination initiated."
