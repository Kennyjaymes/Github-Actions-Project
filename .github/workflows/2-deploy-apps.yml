name: 2 - Deploy Applications (Docker Compose)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 'Deploy to EC2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          EC2_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=DockerAppServer" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text)
          if [ -z "$EC2_IP" ] || [ "$EC2_IP" == "None" ]; then
            echo "Error: Could not find a running EC2 instance with tag Name=DockerAppServer"
            exit 1
          fi
          echo "EC2_IP=$EC2_IP" >> "$GITHUB_OUTPUT"
          echo "Found EC2 Instance IP: $EC2_IP"

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ steps.get-ip.outputs.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "app1/*,app2/*,docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: Deploy via SSH (Docker Compose)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ steps.get-ip.outputs.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "Waiting for Docker to be installed by cloud-init..."
            while ! command -v docker &> /dev/null; do
              echo "Docker not found yet. Sleeping for 10s..."
              sleep 10
            done
            echo "Docker is ready!"
            
            cd /home/ubuntu/app
            sudo docker compose down || true
            sudo docker compose up -d --build
